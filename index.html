<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSISDN Checker Sederhana</title>
    <!-- Menggunakan Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans p-6">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-2xl font-bold">MSISDN Checker</h1>
            <p class="text-sm text-slate-400">Lookup MSISDN (format: 62xxx) • Paste maksimal 10.000 MSISDN</p>
        </div>

        <!-- Box Input -->
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
            <div class="flex gap-3 mb-4">
                <button onclick="checkData()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2 rounded-lg font-medium transition">✓ Check</button>
                <button onclick="clearData()" class="bg-slate-700 hover:bg-slate-600 text-white px-5 py-2 rounded-lg font-medium transition">Clear</button>
            </div>
            
            <textarea id="inputMsisdn" rows="8" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-4 text-slate-200 focus:outline-none focus:border-emerald-500 font-mono text-sm" placeholder="Format: 62xxx&#10;6288211636850&#10;6281234567890"></textarea>
        </div>

        <!-- Hasil Output (Opsional) -->
        <div id="resultArea" class="mt-6 hidden bg-slate-800 p-6 rounded-xl border border-slate-700">
            <h3 class="font-bold mb-2">Hasil Pengecekan:</h3>
            <p id="outputCount" class="text-sm text-emerald-400"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
